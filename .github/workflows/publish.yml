name: Publish

# Tag-driven release: `git tag v1.2.3 && git push origin v1.2.3` is the only
# action needed. The workflow refuses to publish unless the tag matches the
# version in package.json and the full unit suite passes, so a mistyped tag
# cannot ship a half-verified build.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Unit tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: The tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "tag and package.json agree on $version"
      - name: The published tarball must contain the runtime files
        run: |
          npm pack --silent >/dev/null
          tar -tf ./*.tgz > /tmp/files.txt
          for required in index.js client.js cordis.patch.yml lib/events.js lib/transports.js lib/pool.js lib/openssh.js lib/opencode.js locale/en.json locale/zh.json LICENSE; do
            if ! grep -q "package/$required" /tmp/files.txt; then
              echo "::error::the tarball is missing $required"
              exit 1
            fi
          done

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Trusted Publishing: no long-lived token. npm verifies this workflow via
      # the OIDC identity GitHub mints for the job (hence id-token: write), and
      # attaches a provenance statement. It needs npm >= 11.5.1 on the runner
      # and a one-time "Trusted Publisher" entry on the package's npm settings
      # page pointing at this repo + this workflow filename.
      #
      # A granular token with "Bypass 2FA" is NOT a good fallback any more: npm
      # is deprecating 2FA-bypassing tokens for direct publishing, and a token
      # without that flag fails with EOTP and a browser URL CI cannot open.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: npm version
        run: |
          npm --version
          node -e 'const [maj,min]=require("child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (maj<11||(maj===11&&min<5)) { console.error("::error::trusted publishing needs npm >= 11.5.1, found "+maj+"."+min); process.exit(1) }'
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          # Deliberately NOT set: no NODE_AUTH_TOKEN. With OIDC the CLI obtains
          # a short-lived credential from the registry itself.
          NPM_CONFIG_PROVENANCE: 'true'
