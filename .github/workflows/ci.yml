name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests have no DSH dependency: they cover the pure modules (adapters,
  # event building, ssh config parsing, discovery, rollback, host key handling,
  # SQLite reads and the SSH transport's jump-chain planning).
  unit:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.9.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Verify the packed tarball contains what the plugin needs
        run: |
          npm pack --silent > /dev/null
          tar -tzf dsh-conversation-sync-*.tgz | sort > /tmp/packed.txt
          cat /tmp/packed.txt
          for required in package/index.js package/client.js package/cordis.patch.yml \
                           package/lib/events.js package/lib/transports.js \
                           package/lib/opencode.js package/lib/pool.js \
                           package/lib/openssh.js package/lib/hostkey.js \
                           package/locale/en.json package/locale/zh.json \
                           package/LICENSE; do
            grep -qx "$required" /tmp/packed.txt || { echo "missing from tarball: $required"; exit 1; }
          done

  # Ask the registry which releases are actually the most recent, instead of
  # hardcoding a list that silently rots into "the five versions from whenever
  # someone last edited this file". Also resolves the Node version each release
  # needs (they are not all the same) and records any release skipped as broken.
  matrix:
    name: Resolve version matrix
    runs-on: ubuntu-latest
    outputs:
      compatibility: ${{ steps.matrix.outputs.compatibility }}
      functional: ${{ steps.matrix.outputs.functional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Resolve the five most recent DSH releases
        id: matrix
        run: |
          set -euo pipefail
          node scripts/ci/recent-versions.mjs --count 5 > /tmp/recent.json
          cat /tmp/recent.json
          # Feed ONLY the include list to the matrix. The report also carries a
          # `skipped` list, and any extra top-level key in a matrix object is
          # treated as a dimension - which silently collapsed five combinations
          # into one job the first time this ran.
          node -e '
            const report = require("/tmp/recent.json");
            const fs = require("fs");
            const out = process.env.GITHUB_OUTPUT;
            const compatibility = { include: report["include"] };
            // The functional scenarios are the slow end-to-end job: run them on
            // the two newest releases only, which is what "the last two" means.
            const functional = { include: report["include"].slice(-2) };
            fs.writeFileSync(out, "compatibility=" + JSON.stringify(compatibility) + "\n", { flag: "a" });
            fs.writeFileSync(out, "functional=" + JSON.stringify(functional) + "\n", { flag: "a" });
            if (report.skipped?.length) {
              const lines = report.skipped.map(s => `::warning::Skipped DSH ${s.dsh}: ${s.reason}`).join("\n");
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Skipped releases\n\n" + report.skipped.map(s => `- **${s.dsh}** - ${s.reason}`).join("\n") + "\n");
              console.log(lines);
            }
            console.log("compatibility:", JSON.stringify(compatibility));
            console.log("functional:", JSON.stringify(functional));
          '

  # Compatibility: the same plugin installed into several real DSH releases and
  # booted for real. A version passes only when the harness activates the
  # plugin (no "did not activate" warning) AND a conversation imports into a
  # DSH session. This job answers "does it still work on the last five versions?".
  compatibility:
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    needs: [unit, matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.compatibility) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install plugin dependencies and build the tarball
        run: |
          npm install --no-audit --no-fund
          npm pack --silent
      - name: Install DSH ${{ matrix.dsh }}
        run: |
          node scripts/ci/install-dsh.mjs --version '${{ matrix.dsh }}' --dir "$RUNNER_TEMP/dsh" | tee /tmp/install.log
          # The installer's last line is the bin path.
          tail -1 /tmp/install.log > /tmp/dsh-bin.txt
          test -f "$(cat /tmp/dsh-bin.txt)"
      - name: Boot the plugin in a real profile and import a conversation
        run: |
          node scripts/ci/boot-check.mjs \
            --dsh "$(cat /tmp/dsh-bin.txt)" \
            --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home" \
            --port 5399
      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-check-${{ matrix.dsh }}
          path: |
            /tmp/*.log
            ${{ runner.temp }}/home/**
          retention-days: 7
          if-no-files-found: ignore

  # Functional scenarios on the two newest releases: the whole user journey,
  # driven through the real RPC surface the panel uses.
  functional:
    name: Scenarios ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    needs: [unit, matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.functional) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install plugin dependencies and build the tarball
        run: |
          npm install --no-audit --no-fund
          npm pack --silent
      - name: Install DSH ${{ matrix.dsh }}
        run: |
          node scripts/ci/install-dsh.mjs --version '${{ matrix.dsh }}' --dir "$RUNNER_TEMP/dsh" | tee /tmp/install.log
          tail -1 /tmp/install.log > /tmp/dsh-bin.txt
      - name: Scenario - import a real Claude Code rollout
        run: |
          node scripts/ci/scenario.mjs --scenario import \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-import" --port 5401
      - name: Scenario - export a DSH session back to a tool file
        run: |
          node scripts/ci/scenario.mjs --scenario export \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-export" --port 5402
      - name: Scenario - every supported tool format imports
        run: |
          node scripts/ci/scenario.mjs --scenario formats \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-formats" --port 5403
      - name: Scenario - a failing sync reports why and how to retry
        run: |
          node scripts/ci/scenario.mjs --scenario failure \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-failure" --port 5404
      - name: Scenario - a source with no conversation is refused, not imported as a shell
        run: |
          node scripts/ci/scenario.mjs --scenario empty \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-empty" --port 5409 --fixtures "$PWD/test/fixtures"
      - name: Scenario - re-importing does not duplicate messages
        run: |
          node scripts/ci/scenario.mjs --scenario reimport \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-reimport" --port 5405
      - name: Scenario "direction" (sync-all honours the requested direction)
        run: |
          node scripts/ci/scenario.mjs --scenario direction \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-direction" --port 5406
      - name: Scenario "keys" (SSH keys resolve without hand-typing a path)
        run: |
          node scripts/ci/scenario.mjs --scenario keys \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-keys" --port 5407 --fixtures "$PWD/test/fixtures"
      # The only scenario that exercises the remote half: a stand-in `ssh` on
      # PATH stands in for a server, so discovery, reading and importing over the
      # SSH transport all run without needing a reachable host.
      - name: Scenario "ssh" (a remote session is discovered and imported over ssh)
        run: |
          node scripts/ci/scenario.mjs --scenario ssh \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-ssh" --port 5408 --fixtures "$PWD/test/fixtures"
      # The guarantees that are invisible to a unit test: the pre-flight runs
      # inside a live sync, a failed write must leave the source untouched with a
      # backup on disk, an append must continue the session's turns, and both
      # entry switches must default on and toggle independently.
      - name: Scenario "safety" (pre-flight, backup, append, both directions)
        run: |
          node scripts/ci/scenario.mjs --scenario safety \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-safety" --port 5410 --fixtures "$PWD/test/fixtures"
      - name: Scenario "placements" (the two entry switches)
        run: |
          node scripts/ci/scenario.mjs --scenario placements \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-placements" --port 5411 --fixtures "$PWD/test/fixtures"
      # The binding contract: manual by default, gated by its checkbox, and the
      # direction follows whichever side actually changed.
      - name: Scenario "bindings" (manual default, checkbox gate, newer side wins)
        run: |
          node scripts/ci/scenario.mjs --scenario bindings \
            --dsh "$(cat /tmp/dsh-bin.txt)" --tarball "$(ls dsh-conversation-sync-*.tgz)" \
            --home "$RUNNER_TEMP/home-bindings" --port 5412 --fixtures "$PWD/test/fixtures"
      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ matrix.dsh }}
          path: |
            /tmp/*.log
            ${{ runner.temp }}/home-*/**
          retention-days: 7
          if-no-files-found: ignore
